name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-support-operator-copilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: copilot_test
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/copilot_test
      - run: uv run pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/copilot_test
          TEST_DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/copilot_test
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: |
          cp .env.example .env
          docker compose config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  publish_backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, frontend]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/laser54/ai-support-operator-copilot:${{ github.sha }}
            ghcr.io/laser54/ai-support-operator-copilot:latest
      - id: image
        run: echo "image=ghcr.io/laser54/ai-support-operator-copilot:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy_backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish_backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Coolify deployment on the current VPS
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --retry 3 --silent --show-error \
            --request POST \
            --url 'https://coolify.larin.work/api/v1/deploy?uuid=s2lovlkkd5sdrfvyebmnkcav&force=false' \
            --header "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}")
          deployment_uuid=$(printf '%s' "$response" | jq -r '.deployments[0].deployment_uuid')
          test -n "$deployment_uuid" -a "$deployment_uuid" != null
          echo "Coolify deployment queued: ${deployment_uuid}"
          for attempt in $(seq 1 60); do
            status=$(curl --fail-with-body --retry 2 --silent --show-error \
              --url "https://coolify.larin.work/api/v1/deployments/${deployment_uuid}" \
              --header "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" | jq -r '.status')
            echo "Coolify deployment status: ${status}"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled|error) exit 1 ;;
            esac
            sleep 10
          done
          echo 'Coolify deployment timed out' >&2
          exit 1

  deploy_frontend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build and deploy to Vercel production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_BASE_URL: https://api.copilot.larin.work
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
