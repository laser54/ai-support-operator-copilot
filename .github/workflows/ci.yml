name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-support-operator-copilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: copilot_test
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/copilot_test
      - run: uv run pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/copilot_test
          TEST_DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/copilot_test
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: |
          cp .env.example .env
          docker compose config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  publish_backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, frontend]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/laser54/ai-support-operator-copilot:${{ github.sha }}
            ghcr.io/laser54/ai-support-operator-copilot:latest
      - id: image
        run: echo "image=ghcr.io/laser54/ai-support-operator-copilot:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy_backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish_backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure restricted deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.AI_SUPPORT_VPS_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.AI_SUPPORT_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Pull and activate the published revision
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            root@107.174.26.138 "deploy ${GITHUB_SHA}"

  deploy_frontend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build and deploy to Vercel production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_BASE_URL: https://copilot.larin.work
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
